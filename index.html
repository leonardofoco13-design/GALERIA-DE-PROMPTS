<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galeria de Prompts — Leo Gomes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0D10; }
  ::selection { background: #E8A33D55; }
  .chip { transition: all .15s ease; }
  .chip:hover { border-color: #E8A33D; color: #E8A33D; }
  .card { transition: transform .18s ease, border-color .18s ease; }
  .card:hover { transform: translateY(-3px); border-color: #E8A33D66; }
  .scrub { transform: scaleX(0); transform-origin: left; transition: transform .5s ease; }
  .card:hover .scrub { transform: scaleX(1); }
  .copybtn { transition: background .15s ease, transform .1s ease; }
  .copybtn:active { transform: scale(0.94); }
  textarea, input { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2A2E33; border-radius: 4px; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef } = React;

function Icon({ name, size = 16, color = "currentColor" }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const svg = window.lucide.createElement(window.lucide.icons[name]);
      if (svg) {
        svg.setAttribute("width", size);
        svg.setAttribute("height", size);
        svg.setAttribute("stroke", color);
        ref.current.appendChild(svg);
      }
    }
  }, [name, size, color]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center" }} />;
}

const SUGGESTED_CATEGORIES = [
  "Drone cinematográfico", "Hero shot de produto", "Macro em câmera lenta",
  "Timelapse", "Caminhada de personagem", "Talking head", "Subaquático",
  "Aéreo urbano", "Paisagem natural", "Comida em close", "Passarela de moda",
  "Perseguição / ação", "VFX sci-fi", "Estilo anime", "Stop-motion",
  "Filme vintage", "Neon cyberpunk", "Entrevista documental", "Esporte",
  "Tempestade / clima", "Espaço / cósmico", "Arquitetura (flythrough)",
  "Partículas abstratas", "Vlog handheld"
];

const SWATCH_THEMES = [
  ["#F4A340", "#E8622C"], ["#2FA6A0", "#1D5C63"], ["#8A6FE8", "#4B2E9E"],
  ["#E85C7B", "#7A1F3D"], ["#6FBF73", "#1F5C3D"], ["#4FA3E8", "#1D3E6B"],
  ["#E8C34F", "#8A5A1F"], ["#C97BE8", "#5A1F7A"], ["#E87B4F", "#7A2E1F"],
  ["#5FE8C3", "#1F7A5E"],
];

function themeFor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return SWATCH_THEMES[h % SWATCH_THEMES.length];
}

const SUPABASE_URL = "https://eoxwnevswpwjqhqosbdu.supabase.co";
const SUPABASE_KEY = "sb_publishable_REVXV2TM7lOsPNq6EidVoA_iP04IYpS";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function rowToPrompt(row) {
  const variants = Array.isArray(row.prompt_variants) && row.prompt_variants.length
    ? row.prompt_variants
    : row.prompt
    ? [{ label: "Padrão", text: row.prompt }]
    : [];
  return {
    id: row.id,
    title: row.title,
    category: row.category,
    subcategory: row.subcategory || "",
    description: row.description,
    tags: row.tags || [],
    prompt: row.prompt,
    promptVariants: variants,
    videoUrl: row.video_url || "",
    thumbnailUrl: row.thumbnail_url || "",
    position: row.position ?? 0,
  };
}

function promptToRow(item) {
  const variants = item.promptVariants && item.promptVariants.length
    ? item.promptVariants
    : item.prompt
    ? [{ label: "Padrão", text: item.prompt }]
    : [];
  return {
    id: item.id,
    title: item.title,
    category: item.category,
    subcategory: item.subcategory || "",
    description: item.description,
    tags: item.tags || [],
    prompt: variants[0] ? variants[0].text : "",
    prompt_variants: variants,
    video_url: item.videoUrl || "",
    thumbnail_url: item.thumbnailUrl || "",
    position: item.position ?? 0,
  };
}

function isDirectVideoUrl(url) {
  return /\.(mp4|webm|mov|ogg)(\?.*)?$/i.test(url || "");
}

function toEmbedUrl(url) {
  if (!url) return null;
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}?modestbranding=1&rel=0&showinfo=0&iv_load_policy=3`;
  const tiktok = url.match(/tiktok\.com\/@[\w.-]+\/video\/(\d+)/);
  if (tiktok) return `https://www.tiktok.com/player/v1/${tiktok[1]}`;
  const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (drive) return `https://drive.google.com/file/d/${drive[1]}/preview`;
  return null;
}

function toAutoplayEmbedUrl(url) {
  if (!url) return null;
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (yt) {
    const id = yt[1];
    return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&modestbranding=1&playsinline=1&rel=0&showinfo=0&iv_load_policy=3&fs=0&disablekb=1`;
  }
  const tiktok = url.match(/tiktok\.com\/@[\w.-]+\/video\/(\d+)/);
  if (tiktok) {
    const id = tiktok[1];
    return `https://www.tiktok.com/player/v1/${id}?autoplay=1&muted=1&loop=1&controls=0&progress_bar=0&play_button=0&volume_control=0&fullscreen_button=0&timestamp=0&music_info=0&description=0&rel=0&native_context_menu=0&closed_caption=0`;
  }
  const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (drive) return `https://drive.google.com/file/d/${drive[1]}/preview`;
  return null;
}

function toDirectImageUrl(url) {
  if (!url) return "";
  const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (drive) return `https://drive.google.com/thumbnail?id=${drive[1]}&sz=w1000`;
  return url;
}

function PromptCard({ item, copiedId, onOpen, onCopy, onEdit, onDelete, onDuplicate, onDragStart, onDragOver, onDrop, onDragEnd, isDragging }) {
  const [c1, c2] = themeFor(item.category || item.title);
  const hasDirectVideo = isDirectVideoUrl(item.videoUrl);
  const autoplayEmbed = toAutoplayEmbedUrl(item.videoUrl);
  const isDriveEmbed = /drive\.google\.com/.test(item.videoUrl || "");
  return (
    <div
      className="card"
      style={{ ...styles.card, opacity: isDragging ? 0.4 : 1, cursor: "grab" }}
      draggable
      onDragStart={onDragStart}
      onDragOver={onDragOver}
      onDrop={onDrop}
      onDragEnd={onDragEnd}
    >
      <div style={styles.dragHandle}>
        <Icon name="GripVertical" size={14} color="#5A5F68" />
      </div>
      <div
        style={{
          ...styles.swatch,
          background: item.thumbnailUrl || autoplayEmbed || hasDirectVideo
            ? "#0F1114"
            : `linear-gradient(135deg, ${c1}, ${c2})`,
        }}
        onClick={onOpen}
      >
        {autoplayEmbed ? (
          <iframe
            src={autoplayEmbed}
            style={{ ...styles.swatchImg, pointerEvents: "none", border: "none" }}
            allow="autoplay; encrypted-media"
            title={item.title}
          />
        ) : item.thumbnailUrl ? (
          <img src={toDirectImageUrl(item.thumbnailUrl)} alt={item.title} style={styles.swatchImg} />
        ) : hasDirectVideo ? (
          <video src={item.videoUrl} muted autoPlay loop playsInline preload="auto" style={styles.swatchImg} />
        ) : null}
        {(item.videoUrl || hasDirectVideo) && (
          <div style={styles.playBadge}>
            <Icon name="Film" size={13} color="#fff" />
          </div>
        )}
        <span style={styles.swatchCategory}>{item.category}</span>
        <div style={styles.scrubTrack}>
          <div className="scrub" style={styles.scrub} />
        </div>
      </div>
      <div style={styles.cardBody}>
        <h3 style={styles.cardTitle}>{item.title}</h3>
        <p style={styles.cardDesc}>{item.description}</p>
        <div style={styles.tagRow}>
          {(item.tags || []).slice(0, 3).map((t) => (
            <span key={t} style={styles.tag}>{t}</span>
          ))}
        </div>
        <div style={styles.promptPreview}>
          {(() => {
            const variantList = item.promptVariants && item.promptVariants.length ? item.promptVariants : [{ label: "Padrão", text: item.prompt }];
            const isCompact = variantList.length > 1;
            return variantList.map((v, i) => (
              <div key={i} style={isCompact ? styles.variantBlockCompact : styles.variantBlock}>
                <div style={{ flex: 1, minWidth: 0, overflow: "hidden", display: "flex", flexDirection: "column", gap: 2 }}>
                  {isCompact && <span style={styles.variantLabel}>{v.label || `Prompt ${i + 1}`}</span>}
                  {!isCompact && <div style={styles.variantText}>{v.text}</div>}
                </div>
                <button
                  className="copybtn"
                  style={styles.copyBtnSmall}
                  onClick={() => onCopy(v.text, i)}
                >
                  <Icon name={copiedId === `${item.id}-${i}` ? "Check" : "Copy"} size={12} />
                  {copiedId === `${item.id}-${i}` ? "Copiado" : "Copiar"}
                </button>
              </div>
            ));
          })()}
        </div>
        <div style={styles.cardActions}>
          <button style={styles.iconBtn} onClick={onEdit}>
            <Icon name="Pencil" size={14} color="#8A8F98" />
          </button>
          <button style={styles.iconBtn} onClick={onDuplicate}>
            <Icon name="Copy" size={14} color="#8A8F98" />
          </button>
          <button style={styles.iconBtn} onClick={onDelete}>
            <Icon name="Trash2" size={14} color="#8A8F98" />
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [prompts, setPrompts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [activeCategory, setActiveCategory] = useState("Todos");
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [copiedId, setCopiedId] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [draggedId, setDraggedId] = useState(null);

  const handleReorder = async (draggedItemId, targetItemId, listItems) => {
    if (draggedItemId === targetItemId) return;
    const items = [...listItems];
    const fromIndex = items.findIndex((p) => p.id === draggedItemId);
    const toIndex = items.findIndex((p) => p.id === targetItemId);
    if (fromIndex === -1 || toIndex === -1) return;
    const [moved] = items.splice(fromIndex, 1);
    items.splice(toIndex, 0, moved);
    const reindexed = items.map((p, i) => ({ ...p, position: i }));
    setPrompts((prev) => {
      const others = prev.filter((p) => !reindexed.some((r) => r.id === p.id));
      return [...others, ...reindexed].sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
    });
    try {
      await Promise.all(
        reindexed.map((p) => supabaseClient.from("prompts").update({ position: p.position }).eq("id", p.id))
      );
    } catch (e) {
      setSaveError(true);
    }
  };

  useEffect(() => {
    (async () => {
      try {
        const { data, error } = await supabaseClient
          .from("prompts")
          .select("*")
          .order("position", { ascending: true, nullsFirst: false });
        if (error) throw error;
        setPrompts((data || []).map(rowToPrompt));
      } catch (e) {
        setSaveError(true);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const categories = useMemo(() => {
    const set = new Set(prompts.map((p) => p.category).filter(Boolean));
    return ["Todos", ...Array.from(set).sort()];
  }, [prompts]);

  const filtered = useMemo(() => {
    return prompts.filter((p) => {
      const matchesCat = activeCategory === "Todos" || p.category === activeCategory;
      const q = search.trim().toLowerCase();
      const matchesSearch =
        !q ||
        p.title.toLowerCase().includes(q) ||
        p.description.toLowerCase().includes(q) ||
        (p.subcategory || "").toLowerCase().includes(q) ||
        (p.promptVariants || []).some((v) => v.text.toLowerCase().includes(q)) ||
        (p.tags || []).some((t) => t.toLowerCase().includes(q));
      return matchesCat && matchesSearch;
    });
  }, [prompts, activeCategory, search]);

  const groupedByCategory = useMemo(() => {
    const order = categories.filter((c) => c !== "Todos");
    const groups = {};
    filtered.forEach((p) => {
      const key = p.category || "Sem categoria";
      if (!groups[key]) groups[key] = [];
      groups[key].push(p);
    });
    return order
      .filter((c) => groups[c] && groups[c].length)
      .map((c) => {
        const items = groups[c];
        const subGroups = {};
        const subOrder = [];
        items.forEach((p) => {
          const subKey = p.subcategory && p.subcategory.trim() ? p.subcategory.trim() : "__none__";
          if (!subGroups[subKey]) {
            subGroups[subKey] = [];
            subOrder.push(subKey);
          }
          subGroups[subKey].push(p);
        });
        const subsections = subOrder.map((subKey) => ({
          subcategory: subKey === "__none__" ? null : subKey,
          items: subGroups[subKey],
        }));
        return { category: c, items, subsections };
      });
  }, [filtered, categories]);

  const handleCopy = async (itemId, text, variantIndex) => {
    try {
      await navigator.clipboard.writeText(text);
      setCopiedId(`${itemId}-${variantIndex}`);
      setTimeout(() => setCopiedId(null), 1500);
    } catch (e) {}
  };

  const handleDelete = async (id) => {
    const item = prompts.find((p) => p.id === id);
    const confirmed = window.confirm(
      `Tem certeza que quer apagar o prompt "${item ? item.title : "selecionado"}"? Essa ação não pode ser desfeita.`
    );
    if (!confirmed) return;
    const prev = prompts;
    setPrompts(prompts.filter((p) => p.id !== id));
    setExpanded(null);
    try {
      const { error } = await supabaseClient.from("prompts").delete().eq("id", id);
      if (error) throw error;
      setSaveError(false);
    } catch (e) {
      setPrompts(prev);
      setSaveError(true);
    }
  };

  const handleSave = async (item) => {
    try {
      if (editing) {
        const row = promptToRow(item);
        const { error } = await supabaseClient.from("prompts").update(row).eq("id", item.id);
        if (error) throw error;
        setPrompts(prompts.map((p) => (p.id === item.id ? item : p)));
      } else {
        const sameCategory = prompts.filter((p) => p.category === item.category);
        const maxPos = sameCategory.reduce((max, p) => Math.max(max, p.position ?? 0), -1);
        const newItem = { ...item, id: `p-${Date.now()}`, position: maxPos + 1 };
        const row = promptToRow(newItem);
        const { error } = await supabaseClient.from("prompts").insert(row);
        if (error) throw error;
        setPrompts([newItem, ...prompts]);
      }
      setSaveError(false);
      setModalOpen(false);
      setEditing(null);
    } catch (e) {
      setSaveError(true);
    }
  };

  const handleRenameCategory = async (oldName) => {
    const input = window.prompt(`Renomear categoria "${oldName}" para:`, oldName);
    if (!input) return;
    const newName = input.trim();
    if (!newName || newName === oldName) return;
    const prev = prompts;
    setPrompts(prompts.map((p) => (p.category === oldName ? { ...p, category: newName } : p)));
    if (activeCategory === oldName) setActiveCategory(newName);
    try {
      const { error } = await supabaseClient.from("prompts").update({ category: newName }).eq("category", oldName);
      if (error) throw error;
      setSaveError(false);
    } catch (e) {
      setPrompts(prev);
      if (activeCategory === newName) setActiveCategory(oldName);
      setSaveError(true);
    }
  };

  const handleDuplicate = async (item) => {
    const sameCategory = prompts.filter((p) => p.category === item.category);
    const maxPos = sameCategory.reduce((max, p) => Math.max(max, p.position ?? 0), -1);
    const newItem = {
      ...item,
      id: `p-${Date.now()}`,
      title: `${item.title} (cópia)`,
      position: maxPos + 1,
      prompt: "",
      promptVariants: (item.promptVariants || []).length
        ? item.promptVariants.map((v) => ({ label: v.label, text: "" }))
        : [{ label: "", text: "" }],
    };
    try {
      const row = promptToRow(newItem);
      const { error } = await supabaseClient.from("prompts").insert(row);
      if (error) throw error;
      setPrompts([newItem, ...prompts]);
      setEditing(newItem);
      setModalOpen(true);
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  };

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <div style={styles.headerLeft}>
          <div style={styles.logoMark}>
            <Icon name="Clapperboard" size={20} color="#0B0D10" />
          </div>
          <div>
            <h1 style={styles.h1}>Galeria de Prompts</h1>
            <p style={styles.sub}>por Leo Gomes · Biblioteca visual para o Flow (Veo 3)</p>
          </div>
        </div>
        <button
          style={styles.addBtn}
          onClick={() => {
            setEditing(null);
            setModalOpen(true);
          }}
        >
          <Icon name="Plus" size={16} /> Novo prompt
        </button>
      </header>

      <div style={styles.searchRow}>
        <div style={styles.searchBox}>
          <Icon name="Search" size={16} color="#8A8F98" />
          <input
            style={styles.searchInput}
            placeholder="Buscar por título, tag ou palavra do prompt..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
        <span style={styles.countText}>{filtered.length} de {prompts.length}</span>
      </div>

      <div style={styles.chipRow}>
        {categories.map((c) => (
          <div key={c} style={styles.chipWrap}>
            <button
              className="chip"
              onClick={() => setActiveCategory(c)}
              style={{
                ...styles.chip,
                ...(activeCategory === c ? styles.chipActive : {}),
              }}
            >
              {c}
            </button>
            {c !== "Todos" && (
              <button
                style={styles.chipRenameBtn}
                title="Renomear categoria"
                onClick={() => handleRenameCategory(c)}
              >
                <Icon name="Pencil" size={11} color="#5A5F68" />
              </button>
            )}
          </div>
        ))}
      </div>

      {saveError && (
        <div style={styles.errorBanner}>
          Não consegui conectar ao banco de dados agora. Verifique sua internet e tente de novo.
        </div>
      )}

      {loading ? (
        <p style={{ color: "#8A8F98", fontFamily: "Inter, sans-serif" }}>Carregando...</p>
      ) : filtered.length === 0 ? (
        <div style={styles.empty}>
          <Icon name="Film" size={28} color="#5A5F68" />
          <p style={styles.emptyText}>
            {prompts.length === 0
              ? "Sua galeria está vazia. Adicione o primeiro prompt."
              : "Nenhum prompt encontrado para essa busca ou categoria."}
          </p>
        </div>
      ) : (
        <div style={styles.sectionsWrap}>
          {groupedByCategory.map((group) => (
            <section key={group.category} style={styles.section}>
              {activeCategory === "Todos" && <h2 style={styles.sectionTitle}>{group.category}</h2>}
              {group.subsections.map((sub, si) => (
                <div key={sub.subcategory || `__none__-${si}`} style={styles.subsection}>
                  {sub.subcategory && <h3 style={styles.subsectionTitle}>{sub.subcategory}</h3>}
                  <div style={styles.grid}>
                    {sub.items.map((item) => (
                      <PromptCard
                        key={item.id}
                        item={item}
                        copiedId={copiedId}
                        isDragging={draggedId === item.id}
                        onOpen={() => setExpanded(item)}
                        onCopy={(text, i) => handleCopy(item.id, text, i)}
                        onEdit={() => {
                          setEditing(item);
                          setModalOpen(true);
                        }}
                        onDelete={() => handleDelete(item.id)}
                        onDuplicate={() => handleDuplicate(item)}
                        onDragStart={() => setDraggedId(item.id)}
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={(e) => {
                          e.preventDefault();
                          if (draggedId) handleReorder(draggedId, item.id, sub.items);
                          setDraggedId(null);
                        }}
                        onDragEnd={() => setDraggedId(null)}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </section>
          ))}
        </div>
      )}

      {expanded && (
        <div style={styles.overlay} onClick={() => setExpanded(null)}>
          <div style={styles.expandedCard} onClick={(e) => e.stopPropagation()}>
            <button style={styles.closeBtn} onClick={() => setExpanded(null)}>
              <Icon name="X" size={18} color="#8A8F98" />
            </button>
            {(() => {
              const embed = toEmbedUrl(expanded.videoUrl);
              const hasDirectVideo = isDirectVideoUrl(expanded.videoUrl);
              if (embed) {
                return (
                  <div style={styles.expandedMediaWrap}>
                    <iframe
                      src={embed}
                      style={{ ...styles.expandedMedia, height: "100%", maxHeight: "none" }}
                      allow="autoplay; encrypted-media"
                      allowFullScreen
                      title={expanded.title}
                    />
                  </div>
                );
              }
              if (hasDirectVideo) {
                return <video src={expanded.videoUrl} controls style={styles.expandedMedia} />;
              }
              if (expanded.thumbnailUrl) {
                return (
                  <img
                    src={toDirectImageUrl(expanded.thumbnailUrl)}
                    alt={expanded.title}
                    style={styles.expandedMedia}
                  />
                );
              }
              return null;
            })()}
            <span style={styles.expandedCategory}>{expanded.category}</span>
            <h2 style={styles.expandedTitle}>{expanded.title}</h2>
            <p style={styles.expandedDesc}>{expanded.description}</p>
            <div style={styles.tagRow}>
              {(expanded.tags || []).map((t) => (
                <span key={t} style={styles.tag}>{t}</span>
              ))}
            </div>
            {(expanded.promptVariants && expanded.promptVariants.length ? expanded.promptVariants : [{ label: "Padrão", text: expanded.prompt }]).map((v, i) => (
              <div key={i} style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {(expanded.promptVariants || []).length > 1 && (
                  <span style={styles.variantLabel}>{v.label || `Prompt ${i + 1}`}</span>
                )}
                <pre style={styles.fullPrompt}>{v.text}</pre>
                <button
                  className="copybtn"
                  style={{ ...styles.copyBtn, alignSelf: "flex-start" }}
                  onClick={() => handleCopy(expanded.id, v.text, i)}
                >
                  <Icon name={copiedId === `${expanded.id}-${i}` ? "Check" : "Copy"} size={14} />
                  {copiedId === `${expanded.id}-${i}` ? "Copiado" : "Copiar prompt"}
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {modalOpen && (
        <PromptForm
          initial={editing}
          onCancel={() => {
            setModalOpen(false);
            setEditing(null);
          }}
          onSave={handleSave}
        />
      )}
    </div>
  );
}

function PromptForm({ initial, onCancel, onSave }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [category, setCategory] = useState(initial?.category || "");
  const [subcategory, setSubcategory] = useState(initial?.subcategory || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [tags, setTags] = useState((initial?.tags || []).join(", "));
  const [variants, setVariants] = useState(
    initial?.promptVariants && initial.promptVariants.length
      ? initial.promptVariants
      : [{ label: "", text: initial?.prompt || "" }]
  );
  const [videoUrl, setVideoUrl] = useState(initial?.videoUrl || "");
  const [thumbnailUrl, setThumbnailUrl] = useState(initial?.thumbnailUrl || "");
  const [showSuggestions, setShowSuggestions] = useState(false);

  const canSave = title.trim() && category.trim() && variants.some((v) => v.text.trim());

  const updateVariant = (index, field, value) => {
    setVariants((prev) => prev.map((v, i) => (i === index ? { ...v, [field]: value } : v)));
  };

  const addVariant = () => setVariants((prev) => [...prev, { label: "", text: "" }]);

  const removeVariant = (index) => setVariants((prev) => prev.filter((_, i) => i !== index));

  const filteredSuggestions = SUGGESTED_CATEGORIES.filter((c) =>
    c.toLowerCase().includes(category.toLowerCase())
  );

  return (
    <div style={styles.overlay} onClick={onCancel}>
      <div style={styles.formCard} onClick={(e) => e.stopPropagation()}>
        <div style={styles.formHeader}>
          <h2 style={styles.formTitle}>{initial ? "Editar prompt" : "Novo prompt"}</h2>
          <button style={styles.closeBtn} onClick={onCancel}>
            <Icon name="X" size={18} color="#8A8F98" />
          </button>
        </div>

        <label style={styles.label}>Título</label>
        <input style={styles.input} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ex: Drone revelando cidade ao amanhecer" />

        <label style={styles.label}>Categoria</label>
        <div style={{ position: "relative" }}>
          <input
            style={styles.input}
            value={category}
            onFocus={() => setShowSuggestions(true)}
            onBlur={() => setTimeout(() => setShowSuggestions(false), 120)}
            onChange={(e) => setCategory(e.target.value)}
            placeholder="Ex: Drone cinematográfico"
          />
          {showSuggestions && filteredSuggestions.length > 0 && (
            <div style={styles.suggestionsBox}>
              {filteredSuggestions.slice(0, 8).map((c) => (
                <div key={c} style={styles.suggestionItem} onMouseDown={() => setCategory(c)}>{c}</div>
              ))}
            </div>
          )}
        </div>

        <label style={styles.label}>Subcategoria (opcional)</label>
        <input
          style={styles.input}
          value={subcategory}
          onChange={(e) => setSubcategory(e.target.value)}
          placeholder="Ex: Vestidos, Moda praia..."
        />
        <p style={styles.hint}>Agrupa os cards dentro da categoria. Prompts com a mesma subcategoria ficam juntos.</p>

        <label style={styles.label}>Descrição curta</label>
        <input style={styles.input} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Uma frase resumindo o resultado visual" />

        <label style={styles.label}>Tags (separadas por vírgula)</label>
        <input style={styles.input} value={tags} onChange={(e) => setTags(e.target.value)} placeholder="aéreo, amanhecer, cidade" />

        <label style={styles.label}>Prompts deste card</label>
        {variants.map((v, i) => (
          <div key={i} style={styles.variantFormRow}>
            {variants.length > 1 && (
              <input
                style={{ ...styles.input, marginBottom: 6 }}
                value={v.label}
                onChange={(e) => updateVariant(i, "label", e.target.value)}
                placeholder={`Nome do prompt ${i + 1} (ex: Sem áudio)`}
              />
            )}
            <textarea
              style={styles.textarea}
              value={v.text}
              onChange={(e) => updateVariant(i, "text", e.target.value)}
              placeholder="Cole aqui o prompt que você usa no Flow..."
              rows={4}
            />
            {variants.length > 1 && (
              <button style={styles.removeVariantBtn} onClick={() => removeVariant(i)}>
                <Icon name="Trash2" size={12} /> Remover este prompt
              </button>
            )}
          </div>
        ))}
        <button style={styles.addVariantBtn} onClick={addVariant}>
          <Icon name="Plus" size={14} /> Adicionar outro prompt neste card
        </button>

        <label style={styles.label}>Link do vídeo (opcional)</label>
        <input style={styles.input} value={videoUrl} onChange={(e) => setVideoUrl(e.target.value)} placeholder="YouTube, Google Drive ou link direto .mp4" />
        <p style={styles.hint}>YouTube (inclusive Shorts) e TikTok tocam direto aqui dentro. Pro TikTok, use o link completo (tiktok.com/@usuario/video/123...), não o link curto de compartilhamento. Drive e links diretos também funcionam.</p>

        <label style={styles.label}>Link da imagem de capa (opcional)</label>
        <input style={styles.input} value={thumbnailUrl} onChange={(e) => setThumbnailUrl(e.target.value)} placeholder="Link direto de uma imagem (.jpg, .png)" />

        <div style={styles.formActions}>
          <button style={styles.cancelBtn} onClick={onCancel}>Cancelar</button>
          <button
            style={{ ...styles.saveBtn, opacity: canSave ? 1 : 0.5 }}
            disabled={!canSave}
            onClick={() =>
              onSave({
                id: initial?.id,
                title: title.trim(),
                category: category.trim(),
                subcategory: subcategory.trim(),
                description: description.trim(),
                tags: tags.split(",").map((t) => t.trim()).filter(Boolean),
                promptVariants: variants
                  .map((v) => ({ label: v.label.trim(), text: v.text.trim() }))
                  .filter((v) => v.text),
                videoUrl: videoUrl.trim(),
                thumbnailUrl: thumbnailUrl.trim(),
              })
            }
          >
            Salvar
          </button>
        </div>
      </div>
    </div>
  );
}
