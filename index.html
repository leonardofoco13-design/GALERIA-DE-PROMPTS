<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galeria de Prompts — Flow (Veo 3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0D10; }
  ::selection { background: #E8A33D55; }
  .chip { transition: all .15s ease; }
  .chip:hover { border-color: #E8A33D; color: #E8A33D; }
  .card { transition: transform .18s ease, border-color .18s ease; }
  .card:hover { transform: translateY(-3px); border-color: #E8A33D66; }
  .scrub { transform: scaleX(0); transform-origin: left; transition: transform .5s ease; }
  .card:hover .scrub { transform: scaleX(1); }
  .copybtn { transition: background .15s ease, transform .1s ease; }
  .copybtn:active { transform: scale(0.94); }
  textarea, input { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2A2E33; border-radius: 4px; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef } = React;

function Icon({ name, size = 16, color = "currentColor" }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const svg = window.lucide.createElement(window.lucide.icons[name]);
      if (svg) {
        svg.setAttribute("width", size);
        svg.setAttribute("height", size);
        svg.setAttribute("stroke", color);
        ref.current.appendChild(svg);
      }
    }
  }, [name, size, color]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center" }} />;
}

const SUGGESTED_CATEGORIES = [
  "Drone cinematográfico", "Hero shot de produto", "Macro em câmera lenta",
  "Timelapse", "Caminhada de personagem", "Talking head", "Subaquático",
  "Aéreo urbano", "Paisagem natural", "Comida em close", "Passarela de moda",
  "Perseguição / ação", "VFX sci-fi", "Estilo anime", "Stop-motion",
  "Filme vintage", "Neon cyberpunk", "Entrevista documental", "Esporte",
  "Tempestade / clima", "Espaço / cósmico", "Arquitetura (flythrough)",
  "Partículas abstratas", "Vlog handheld"
];

const SWATCH_THEMES = [
  ["#F4A340", "#E8622C"], ["#2FA6A0", "#1D5C63"], ["#8A6FE8", "#4B2E9E"],
  ["#E85C7B", "#7A1F3D"], ["#6FBF73", "#1F5C3D"], ["#4FA3E8", "#1D3E6B"],
  ["#E8C34F", "#8A5A1F"], ["#C97BE8", "#5A1F7A"], ["#E87B4F", "#7A2E1F"],
  ["#5FE8C3", "#1F7A5E"],
];

function themeFor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return SWATCH_THEMES[h % SWATCH_THEMES.length];
}

const STORAGE_KEY = "galeria-video-prompts";

function isDirectVideoUrl(url) {
  return /\.(mp4|webm|mov|ogg)(\?.*)?$/i.test(url || "");
}

function toEmbedUrl(url) {
  if (!url) return null;
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (drive) return `https://drive.google.com/file/d/${drive[1]}/preview`;
  return null;
}

function toDirectImageUrl(url) {
  if (!url) return "";
  const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (drive) return `https://drive.google.com/thumbnail?id=${drive[1]}&sz=w1000`;
  return url;
}

function App() {
  const [prompts, setPrompts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [activeCategory, setActiveCategory] = useState("Todos");
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [copiedId, setCopiedId] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [saveError, setSaveError] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setPrompts(JSON.parse(raw));
    } catch (e) {
      setSaveError(true);
    } finally {
      setLoading(false);
    }
  }, []);

  const persist = (next) => {
    setPrompts(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  };

  const categories = useMemo(() => {
    const set = new Set(prompts.map((p) => p.category).filter(Boolean));
    return ["Todos", ...Array.from(set).sort()];
  }, [prompts]);

  const filtered = useMemo(() => {
    return prompts.filter((p) => {
      const matchesCat = activeCategory === "Todos" || p.category === activeCategory;
      const q = search.trim().toLowerCase();
      const matchesSearch =
        !q ||
        p.title.toLowerCase().includes(q) ||
        p.description.toLowerCase().includes(q) ||
        p.prompt.toLowerCase().includes(q) ||
        (p.tags || []).some((t) => t.toLowerCase().includes(q));
      return matchesCat && matchesSearch;
    });
  }, [prompts, activeCategory, search]);

  const handleCopy = async (item) => {
    try {
      await navigator.clipboard.writeText(item.prompt);
      setCopiedId(item.id);
      setTimeout(() => setCopiedId(null), 1500);
    } catch (e) {}
  };

  const handleDelete = (id) => {
    persist(prompts.filter((p) => p.id !== id));
    setExpanded(null);
  };

  const handleSave = (item) => {
    if (editing) {
      persist(prompts.map((p) => (p.id === item.id ? item : p)));
    } else {
      persist([{ ...item, id: `p-${Date.now()}` }, ...prompts]);
    }
    setModalOpen(false);
    setEditing(null);
  };

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <div style={styles.headerLeft}>
          <div style={styles.logoMark}>
            <Icon name="Clapperboard" size={20} color="#0B0D10" />
          </div>
          <div>
            <h1 style={styles.h1}>Galeria de Prompts</h1>
            <p style={styles.sub}>Biblioteca visual para o Flow (Veo 3)</p>
          </div>
        </div>
        <button
          style={styles.addBtn}
          onClick={() => {
            setEditing(null);
            setModalOpen(true);
          }}
        >
          <Icon name="Plus" size={16} /> Novo prompt
        </button>
      </header>

      <div style={styles.searchRow}>
        <div style={styles.searchBox}>
          <Icon name="Search" size={16} color="#8A8F98" />
          <input
            style={styles.searchInput}
            placeholder="Buscar por título, tag ou palavra do prompt..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
        <span style={styles.countText}>{filtered.length} de {prompts.length}</span>
      </div>

      <div style={styles.chipRow}>
        {categories.map((c) => (
          <button
            key={c}
            className="chip"
            onClick={() => setActiveCategory(c)}
            style={{
              ...styles.chip,
              ...(activeCategory === c ? styles.chipActive : {}),
            }}
          >
            {c}
          </button>
        ))}
      </div>

      {saveError && (
        <div style={styles.errorBanner}>
          Não consegui salvar agora. Suas alterações podem não persistir — tente de novo em instantes.
        </div>
      )}

      {loading ? (
        <p style={{ color: "#8A8F98", fontFamily: "Inter, sans-serif" }}>Carregando...</p>
      ) : filtered.length === 0 ? (
        <div style={styles.empty}>
          <Icon name="Film" size={28} color="#5A5F68" />
          <p style={styles.emptyText}>
            {prompts.length === 0
              ? "Sua galeria está vazia. Adicione o primeiro prompt."
              : "Nenhum prompt encontrado para essa busca ou categoria."}
          </p>
        </div>
      ) : (
        <div style={styles.grid}>
          {filtered.map((item) => {
            const [c1, c2] = themeFor(item.category || item.title);
            const hasDirectVideo = isDirectVideoUrl(item.videoUrl);
            return (
              <div key={item.id} className="card" style={styles.card}>
                <div
                  style={{
                    ...styles.swatch,
                    background: item.thumbnailUrl
                      ? "#0F1114"
                      : `linear-gradient(135deg, ${c1}, ${c2})`,
                  }}
                  onClick={() => setExpanded(item)}
                >
                  {item.thumbnailUrl ? (
                    <img src={toDirectImageUrl(item.thumbnailUrl)} alt={item.title} style={styles.swatchImg} />
                  ) : hasDirectVideo ? (
                    <video src={item.videoUrl} muted preload="metadata" style={styles.swatchImg} />
                  ) : null}
                  {(item.videoUrl || hasDirectVideo) && (
                    <div style={styles.playBadge}>
                      <Icon name="Film" size={13} color="#fff" />
                    </div>
                  )}
                  <span style={styles.swatchCategory}>{item.category}</span>
                  <div style={styles.scrubTrack}>
                    <div className="scrub" style={styles.scrub} />
                  </div>
                </div>
                <div style={styles.cardBody}>
                  <h3 style={styles.cardTitle}>{item.title}</h3>
                  <p style={styles.cardDesc}>{item.description}</p>
                  <div style={styles.tagRow}>
                    {(item.tags || []).slice(0, 3).map((t) => (
                      <span key={t} style={styles.tag}>{t}</span>
                    ))}
                  </div>
                  <div style={styles.promptPreview}>{item.prompt}</div>
                  <div style={styles.cardActions}>
                    <button className="copybtn" style={styles.copyBtn} onClick={() => handleCopy(item)}>
                      <Icon name={copiedId === item.id ? "Check" : "Copy"} size={14} />
                      {copiedId === item.id ? "Copiado" : "Copiar prompt"}
                    </button>
                    <button
                      style={styles.iconBtn}
                      onClick={() => {
                        setEditing(item);
                        setModalOpen(true);
                      }}
                    >
                      <Icon name="Pencil" size={14} color="#8A8F98" />
                    </button>
                    <button style={styles.iconBtn} onClick={() => handleDelete(item.id)}>
                      <Icon name="Trash2" size={14} color="#8A8F98" />
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {expanded && (
        <div style={styles.overlay} onClick={() => setExpanded(null)}>
          <div style={styles.expandedCard} onClick={(e) => e.stopPropagation()}>
            <button style={styles.closeBtn} onClick={() => setExpanded(null)}>
              <Icon name="X" size={18} color="#8A8F98" />
            </button>
            {(() => {
              const embed = toEmbedUrl(expanded.videoUrl);
              const hasDirectVideo = isDirectVideoUrl(expanded.videoUrl);
              if (embed) {
                return (
                  <div style={styles.expandedMediaWrap}>
                    <iframe
                      src={embed}
                      style={styles.expandedMedia}
                      allow="autoplay; encrypted-media"
                      allowFullScreen
                      title={expanded.title}
                    />
                  </div>
                );
              }
              if (hasDirectVideo) {
                return <video src={expanded.videoUrl} controls style={styles.expandedMedia} />;
              }
              if (expanded.thumbnailUrl) {
                return (
                  <img
                    src={toDirectImageUrl(expanded.thumbnailUrl)}
                    alt={expanded.title}
                    style={styles.expandedMedia}
                  />
                );
              }
              return null;
            })()}
            <span style={styles.expandedCategory}>{expanded.category}</span>
            <h2 style={styles.expandedTitle}>{expanded.title}</h2>
            <p style={styles.expandedDesc}>{expanded.description}</p>
            <div style={styles.tagRow}>
              {(expanded.tags || []).map((t) => (
                <span key={t} style={styles.tag}>{t}</span>
              ))}
            </div>
            <pre style={styles.fullPrompt}>{expanded.prompt}</pre>
            <button
              className="copybtn"
              style={{ ...styles.copyBtn, alignSelf: "flex-start" }}
              onClick={() => handleCopy(expanded)}
            >
              <Icon name={copiedId === expanded.id ? "Check" : "Copy"} size={14} />
              {copiedId === expanded.id ? "Copiado" : "Copiar prompt"}
            </button>
          </div>
        </div>
      )}

      {modalOpen && (
        <PromptForm
          initial={editing}
          onCancel={() => {
            setModalOpen(false);
            setEditing(null);
          }}
          onSave={handleSave}
        />
      )}
    </div>
  );
}

function PromptForm({ initial, onCancel, onSave }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [category, setCategory] = useState(initial?.category || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [tags, setTags] = useState((initial?.tags || []).join(", "));
  const [prompt, setPrompt] = useState(initial?.prompt || "");
  const [videoUrl, setVideoUrl] = useState(initial?.videoUrl || "");
  const [thumbnailUrl, setThumbnailUrl] = useState(initial?.thumbnailUrl || "");
  const [showSuggestions, setShowSuggestions] = useState(false);

  const canSave = title.trim() && category.trim() && prompt.trim();

  const filteredSuggestions = SUGGESTED_CATEGORIES.filter((c) =>
    c.toLowerCase().includes(category.toLowerCase())
  );

  return (
    <div style={styles.overlay} onClick={onCancel}>
      <div style={styles.formCard} onClick={(e) => e.stopPropagation()}>
        <div style={styles.formHeader}>
          <h2 style={styles.formTitle}>{initial ? "Editar prompt" : "Novo prompt"}</h2>
          <button style={styles.closeBtn} onClick={onCancel}>
            <Icon name="X" size={18} color="#8A8F98" />
          </button>
        </div>

        <label style={styles.label}>Título</label>
        <input style={styles.input} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ex: Drone revelando cidade ao amanhecer" />

        <label style={styles.label}>Categoria</label>
        <div style={{ position: "relative" }}>
          <input
            style={styles.input}
            value={category}
            onFocus={() => setShowSuggestions(true)}
            onBlur={() => setTimeout(() => setShowSuggestions(false), 120)}
            onChange={(e) => setCategory(e.target.value)}
            placeholder="Ex: Drone cinematográfico"
          />
          {showSuggestions && filteredSuggestions.length > 0 && (
            <div style={styles.suggestionsBox}>
              {filteredSuggestions.slice(0, 8).map((c) => (
                <div key={c} style={styles.suggestionItem} onMouseDown={() => setCategory(c)}>{c}</div>
              ))}
            </div>
          )}
        </div>

        <label style={styles.label}>Descrição curta</label>
        <input style={styles.input} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Uma frase resumindo o resultado visual" />

        <label style={styles.label}>Tags (separadas por vírgula)</label>
        <input style={styles.input} value={tags} onChange={(e) => setTags(e.target.value)} placeholder="aéreo, amanhecer, cidade" />

        <label style={styles.label}>Prompt completo</label>
        <textarea style={styles.textarea} value={prompt} onChange={(e) => setPrompt(e.target.value)} placeholder="Cole aqui o prompt que você usa no Flow..." rows={5} />

        <label style={styles.label}>Link do vídeo (opcional)</label>
        <input style={styles.input} value={videoUrl} onChange={(e) => setVideoUrl(e.target.value)} placeholder="YouTube, Google Drive ou link direto .mp4" />
        <p style={styles.hint}>YouTube (inclusive Shorts) toca direto aqui dentro. Drive e links diretos também funcionam.</p>

        <label style={styles.label}>Link da imagem de capa (opcional)</label>
        <input style={styles.input} value={thumbnailUrl} onChange={(e) => setThumbnailUrl(e.target.value)} placeholder="Link direto de uma imagem (.jpg, .png)" />

        <div style={styles.formActions}>
          <button style={styles.cancelBtn} onClick={onCancel}>Cancelar</button>
          <button
            style={{ ...styles.saveBtn, opacity: canSave ? 1 : 0.5 }}
            disabled={!canSave}
            onClick={() =>
              onSave({
                id: initial?.id,
                title: title.trim(),
                category: category.trim(),
                description: description.trim(),
                tags: tags.split(",").map((t) => t.trim()).filter(Boolean),
                prompt: prompt.trim(),
                videoUrl: videoUrl.trim(),
                thumbnailUrl: thumbnailUrl.trim(),
              })
            }
          >
            Salvar
          </button>
        </div>
      </div>
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "#0B0D10", color: "#EDEAE3", fontFamily: "'Inter', sans-serif", padding: "28px 24px 60px" },
  header: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22, flexWrap: "wrap", gap: 12 },
  headerLeft: { display: "flex", alignItems: "center", gap: 12 },
  logoMark: { width: 38, height: 38, borderRadius: 10, background: "#E8A33D", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 },
  h1: { fontFamily: "'Space Grotesk', sans-serif", fontSize: 20, fontWeight: 700, margin: 0, letterSpacing: "-0.01em" },
  sub: { margin: 0, fontSize: 13, color: "#8A8F98" },

  searchRow: { display: "flex", alignItems: "center", gap: 14, marginBottom: 14, flexWrap: "wrap" },
  searchBox: { display: "flex", alignItems: "center", gap: 8, background: "#14171B", border: "1px solid #22262B", borderRadius: 8, padding: "9px 12px", flex: "1 1 320px" },
  searchInput: { background: "transparent", border: "none", outline: "none", color: "#EDEAE3", fontSize: 14, width: "100%" },
  countText: { fontSize: 12, color: "#5A5F68", whiteSpace: "nowrap" },
  chipRow: { display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 22 },
  chip: { background: "#14171B", border: "1px solid #22262B", color: "#8A8F98", borderRadius: 999, padding: "6px 13px", fontSize: 12.5, cursor: "pointer" },
  chipActive: { borderColor: "#E8A33D", color: "#E8A33D", background: "#E8A33D14" },
  errorBanner: { background: "#3A1F1F", border: "1px solid #5A2E2E", color: "#E8A0A0", borderRadius: 8, padding: "10px 14px", fontSize: 13, marginBottom: 16 },
  empty: { display: "flex", flexDirection: "column", alignItems: "center", gap: 10, padding: "60px 0", textAlign: "center" },
  emptyText: { color: "#5A5F68", fontSize: 14, margin: 0, maxWidth: 320 },

  playBadge: { position: "absolute", bottom: 8, right: 8, background: "rgba(11,13,16,0.6)", borderRadius: 6, padding: 5, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1 },
  expandedMediaWrap: { width: "100%", aspectRatio: "16 / 9", borderRadius: 10, overflow: "hidden", background: "#000" },
  expandedMedia: { width: "100%", borderRadius: 10, display: "block", maxHeight: 320, objectFit: "cover", border: "none" },
  hint: { fontSize: 11, color: "#5A5F68", margin: "2px 0 0" },
  cardBody: { padding: 14, display: "flex", flexDirection: "column", gap: 8 },
  cardTitle: { fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, margin: 0, lineHeight: 1.3 },
  cardDesc: { fontSize: 12.5, color: "#8A8F98", margin: 0, lineHeight: 1.4 },
  tagRow: { display: "flex", flexWrap: "wrap", gap: 6 },
  tag: { fontSize: 10.5, color: "#2FA6A0", background: "#2FA6A014", border: "1px solid #2FA6A033", borderRadius: 999, padding: "2px 8px" },
  promptPreview: { fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "#6B7078", background: "#0F1114", border: "1px solid #1D2126", borderRadius: 6, padding: "8px 10px", lineHeight: 1.5, maxHeight: 58, overflow: "hidden" },

  copyBtn: { display: "flex", alignItems: "center", gap: 6, background: "#3FAE5C", color: "#0B0D10", border: "none", borderRadius: 7, padding: "7px 11px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", flex: 1, justifyContent: "center" },
  iconBtn: { background: "transparent", border: "1px solid #22262B", borderRadius: 7, width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" },
  overlay: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 },
  expandedCard: { background: "#14171B", border: "1px solid #22262B", borderRadius: 14, padding: 26, maxWidth: 520, width: "100%", position: "relative", display: "flex", flexDirection: "column", gap: 10, maxHeight: "80vh", overflowY: "auto" },
  expandedCategory: { fontSize: 12, color: "#E8A33D", fontWeight: 600 },
  expandedTitle: { fontFamily: "'Space Grotesk', sans-serif", fontSize: 20, margin: 0 },
  expandedDesc: { color: "#8A8F98", fontSize: 13.5, margin: 0 },
  fullPrompt: { fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, color: "#D8D4C8", background: "#0F1114", border: "1px solid #1D2126", borderRadius: 8, padding: 14, whiteSpace: "pre-wrap", lineHeight: 1.6, margin: 0 },
  closeBtn: { position: "absolute", top: 16, right: 16, background: "transparent", border: "none", cursor: "pointer" },
  formCard: { background: "#14171B", border: "1px solid #22262B", borderRadius: 14, padding: 26, maxWidth: 480, width: "100%", display: "flex", flexDirection: "column", gap: 6, maxHeight: "85vh", overflowY: "auto", position: "relative" },
  formHeader: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 },
